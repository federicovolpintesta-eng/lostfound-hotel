<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lost & Found - Hotel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- LOGIN -->
  <div id="loginForm" class="login-form">
    <h2>Iniciar sesión</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Contraseña">
    <button onclick="login()">Entrar</button>
  </div>

  <!-- APP -->
  <div id="appContent" class="app" style="display:none;">

    <aside class="sidebar">
      <h2>Hotel System</h2>
      <ul>
        <li onclick="mostrar('dashboard')">Dashboard</li>
        <li onclick="mostrar('lf')">Objetos Perdidos</li>
        <li onclick="mostrar('reportes')">Reportes</li>
      </ul>
    </aside>

    <main class="contenido">
      <header>
        <h1>Lost & Found</h1>
      </header>

      <!-- DASHBOARD -->
      <section class="kpi" id="dashboard">
        <div class="card">
          <p>Pendientes</p>
          <span id="kpiPendientes">0</span>
        </div>
        <div class="card">
          <p>Entregados</p>
          <span id="kpiEntregados">0</span>
        </div>
      </section>

      <!-- OBJETOS PERDIDOS -->
      <section id="lf" style="display:none;">
        <div class="formulario">
          <div class="form-header">
            <h3>Nuevo registro</h3>
            <div class="busqueda-box">
              <span class="icono">🔍</span>
              <input 
                type="text" 
                id="buscador"
                placeholder="Buscar habitación, objeto o sector..."
                onkeyup="filtrarOlvidos()"
              />
            </div>
          </div>
          <h3>Habitación</h3>
          <input type="text" id="habitacion" placeholder="Habitación">
          <h3>Objeto</h3>
          <input type="text" id="objeto" placeholder="Objeto">
          <h3>Sector</h3>
          <input type="text" id="sector" placeholder="Sector">
          <input type="file" id="imagen" accept="image/*">
          <button onclick="guardarOlvido()">Guardar</button>
        </div>

        <div>
          <h3>Pendientes</h3>
          <table>
            <thead>
              <tr>
                <th>Hab.</th>
                <th>Objeto</th>
                <th>Sector</th>
                <th>Foto</th>
                <th>Encontrado</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="pendientes"></tbody>
          </table>
        </div>
      </section>

      <!-- REPORTES -->
      <section id="reportes" style="display:none;">
        <h3>Historial</h3>
        <table>
          <thead>
            <tr>
              <th>Hab.</th>
              <th>Objeto</th>
              <th>Sector</th>
              <th>Foto</th>
              <th>Encontrado</th>
              <th>Entregado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="entregados"></tbody>
        </table>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
