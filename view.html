<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Objeto | Lost & Found</title>
    <!-- Security Meta Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://images.unsplash.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Premium Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/view.js"></script>
    <style>
        .view-container {
            max-width: 620px;
            margin: 32px auto 60px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .brand-header-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 8px;
        }
        .brand-header-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            background: #ffffff;
            padding: 10px 32px;
            border-radius: 999px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.8);
            transition: transform 0.2s ease;
        }
        .brand-header-badge:hover {
            transform: scale(1.02);
        }
        .brand-logo-img {
            height: 38px;
            width: auto;
            max-width: 140px;
            object-fit: contain;
            display: block;
        }
        .brand-divider {
            width: 1px;
            height: 28px;
            background: #cbd5e1;
        }
        .brand-portal-tag {
            margin-top: 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .view-card {
            padding: 32px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-glass);
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(24px);
        }
        .view-title {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            color: var(--text-heading);
            letter-spacing: -0.02em;
            margin: 0;
            line-height: 1.2;
        }
        .view-image {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        /* State Banners */
        .state-banner {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid transparent;
        }
        .state-delivered {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.25);
            color: #34d399;
        }
        .state-custody {
            background: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.25);
            color: #38bdf8;
        }
        .state-badge-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .state-delivered .state-badge-icon {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        .state-custody .state-badge-icon {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
        }
        .state-badge-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            line-height: 1.2;
        }
        .state-badge-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        /* Details Grid */
        .view-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .detail-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .detail-item.full-width {
            grid-column: span 2;
        }
        .detail-recipient {
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(16, 185, 129, 0.25);
        }
        .detail-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .detail-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }
        .detail-value-recipient {
            font-size: 18px;
            font-weight: 700;
            color: #34d399;
        }
        .official-seal-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
        }
        @media (max-width: 520px) {
            .view-details {
                grid-template-columns: 1fr;
            }
            .detail-item.full-width {
                grid-column: span 1;
            }
            .brand-header-badge {
                gap: 16px;
                padding: 8px 20px;
            }
            .brand-logo-img {
                height: 32px;
            }
        }
    </style>
</head>
<body>
    <!-- Cinematic Photographic Background -->
    <div class="cinematic-bg">
        <div class="slideshow-image slide-1"></div>
        <div class="slideshow-image slide-2"></div>
        <div class="slideshow-image slide-3"></div>
        <div class="slideshow-image slide-4"></div>
    </div>
    <div class="cinematic-overlay"></div>
    <div class="noise-overlay"></div>

    <div class="view-container" id="loadingContainer">
        <div class="view-card glass-panel" style="text-align: center;">
            <h2 style="color: var(--text-muted); font-size: 18px; font-weight: 600;">Consultando sistema...</h2>
        </div>
    </div>

    <div class="view-container" id="contentContainer" style="display: none;">
        <div class="brand-header-wrapper">
            <div class="brand-header-badge">
                <img src="img/los-pinos.png" alt="Los Pinos Resort & Spa" class="brand-logo-img">
                <div class="brand-divider"></div>
                <img src="img/tremun.jpeg" alt="Tremun Hoteles" class="brand-logo-img">
            </div>
            <div class="brand-portal-tag">LOS PINOS RESORT &bull; GOBERNANZA &bull; LOST &amp; FOUND</div>
        </div>
        <div class="view-card glass-panel" id="dataCard">
            <!-- Data will be injected here by view.js -->
        </div>
    </div>

</body>
</html>
