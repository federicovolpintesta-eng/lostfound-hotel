<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Objeto | Lost & Found</title>
    <!-- Premium Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/view.js"></script>
    <style>
        .view-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .view-card {
            padding: 30px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .view-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-glass);
        }
        .view-details {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .detail-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
        }
        .detail-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .detail-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }
        .brand-logos {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .brand-logos img {
            height: 40px;
            object-fit: contain;
        }
        .view-title {
            text-align: center;
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            margin-top: 10px;
        }
        .status-custodia { background: rgba(56, 189, 248, 0.15); color: var(--primary); }
        .status-entregado { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    </style>
</head>
<body>
    <!-- Cinematic Photographic Background -->
    <div class="cinematic-bg">
        <div class="slideshow-image slide-1"></div>
        <div class="slideshow-image slide-2"></div>
        <div class="slideshow-image slide-3"></div>
        <div class="slideshow-image slide-4"></div>
    </div>
    <div class="cinematic-overlay"></div>
    <div class="noise-overlay"></div>

    <div class="view-container" id="loadingContainer">
        <div class="view-card glass-panel" style="text-align: center;">
            <h2 style="color: var(--text-muted);">Cargando información...</h2>
        </div>
    </div>

    <div class="view-container" id="contentContainer" style="display: none;">
        <div class="brand-logos">
            <img src="img/los-pinos.png" alt="Los Pinos">
            <img src="img/tremun.jpeg" alt="Tremun">
        </div>
        <div class="view-card glass-panel" id="dataCard">
            <!-- Data will be injected here by view.js -->
        </div>
    </div>

</body>
</html>
